<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      (() => {
        const repoBase = '/Praktikum_Pengembangan-UI1';
        const path = window.location.pathname;
        const redirect = path.startsWith(repoBase) ? path.slice(repoBase.length) || '/' : '/';
        window.location.replace(`${repoBase}/?redirect=${encodeURIComponent(redirect)}`);
      })();
    </script>
  </head>
  <body></body>
</html>
